<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarjeta de reseñas</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#eefaf2,#e8fbe6);color:#101826;padding:24px;box-sizing:border-box}
.c{max-width:380px;width:100%;background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(20,110,70,.15)}
h1{font-size:22px;margin:0 0 8px}p{color:#5a6475;margin:0 0 18px;line-height:1.5}
a.b{display:block;padding:13px;border-radius:99px;text-decoration:none;font-weight:600;margin-top:10px;background:linear-gradient(150deg,#b5efa0,#2fb37c 48%,#12855f);color:#fff}
a.g{background:#eef6f1;color:#101826}.sp{width:34px;height:34px;border:3px solid #d6f0df;border-top-color:#12855f;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div class="c" id="c"><div class="sp"></div><p>Abriendo reseñas…</p></div>
<script>
(function(){
  var id=(location.search.replace(/^\?/,'').split('&')[0]||location.hash.slice(1)).replace(/[^0-9]/g,'');
  while(id.length&&id.length<3)id='0'+id;
  var box=document.getElementById('c');
  function show(t,m){box.innerHTML='<h1>'+t+'</h1><p>'+m+'</p>'+"593963278186".replace(/^(.+)$/,'<a class="b" href="https://wa.me/$1">Escríbeme por WhatsApp</a>')+"josue_herrera09".replace(/^(.+)$/,'<a class="b g" href="https://instagram.com/$1">@$1 en Instagram</a>')}
  fetch('tarjetas.json?v='+Date.now()).then(function(r){return r.json()}).then(function(d){
    var t=d.tarjetas&&d.tarjetas[id];
    if(t&&t.estado==='asignada'&&/^https?:\/\//.test(t.link)){location.replace(t.link);return}
    if(t&&t.estado==='pausada'){show('Tarjeta en pausa','Esta tarjeta de reseñas no está activa por ahora.');return}
    show('Tarjeta disponible','Esta tarjeta de reseñas con NFC todavía no está asignada a un negocio. ¿La quieres para el tuyo?');
  }).catch(function(){show('No se pudo abrir','Revisa tu conexión e intenta de nuevo.')});
})();
</script></body></html>
